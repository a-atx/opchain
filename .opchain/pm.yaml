# opchain PM-tool configuration
# Read by opchain skills during Claude Code sessions to route issue reads/writes
# via the Linear MCP server. See skills/oc-integrations-engineer/SKILL.md §PM-Tool MCP Integration.
#
# Auth: set LINEAR_API_KEY in .dev.vars (local) or Cloudflare dashboard (prod).
# Staging: no API key required — wrangler.jsonc sets FEEDBACK_DRY_RUN=true so
# the feedback handler accepts submissions without writing to Linear.
# Example PM-tool configuration shipped with the opchain product.
# Replace the placeholder project key and state/label names for your tracker.
# Authentication belongs in environment configuration; never store tokens here.

provider: linear
team_or_project: EXAMPLE

issue_types:
  feature: Feature
  bug: Bug
  deploy: Deploy
  incident: Incident

states:
  in_progress: "In Progress"
  in_review: "In Review"
  done: "Done"

labels_default: [opchain, agent-driven]

mcp_server: linear

# Release state lives in .checkpoints/ (session state) and /changelog
# (site/src/data/roadmap-static.ts) — not here. A prior "Active release
# tracking" block in this file went stale for 5+ releases (pinned at
# v1.4.0 while the repo shipped through v1.8.0) because nothing kept it
# in sync; removed rather than re-added to avoid the same drift.
